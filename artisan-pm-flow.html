<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artisan · PM Shipping Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #060B17;
  --s1:       #0D1526;
  --s2:       #162033;
  --s3:       #1E2D45;
  --border:   #1E2D45;
  --border-h: #2D4060;
  --primary:  #4F46E5;
  --emerald:  #10B981;
  --amber:    #F59E0B;
  --red:      #EF4444;
  --violet:   #8B5CF6;
  --t1:       #F1F5F9;
  --t2:       #94A3B8;
  --t3:       #4A6080;
}

html, body, #root { height: 100%; background: var(--bg); }
body { font-family: 'Inter', system-ui, sans-serif; color: var(--t1); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.6; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 3px; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
@keyframes spin  { to { transform: rotate(360deg); } }

.screen-enter { animation: fadeUp 0.2s cubic-bezier(0.22,1,0.36,1) both; }
.pulse-dot    { animation: pulse 2s ease-in-out infinite; }
.spin         { animation: spin 1s linear infinite; }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 5px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
button, a { touch-action: manipulation; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useCallback } = React;

/* ── Tokens ── */
const T = {
  bg:'#060B17', s1:'#0D1526', s2:'#162033', s3:'#1E2D45',
  border:'#1E2D45', borderH:'#2D4060',
  primary:'#4F46E5', primaryH:'#4338CA',
  p10:'rgba(79,70,229,.10)', p20:'rgba(79,70,229,.20)',
  emerald:'#10B981', e10:'rgba(16,185,129,.10)',
  amber:'#F59E0B',   a10:'rgba(245,158,11,.10)',
  red:'#EF4444',     r10:'rgba(239,68,68,.10)',
  violet:'#8B5CF6',
  t1:'#F1F5F9', t2:'#94A3B8', t3:'#4A6080',
};
const G = "'Space Grotesk',sans-serif";
const I = "'Inter',sans-serif";

/* ── Primitives ── */
const Tag = ({ color=T.t3, bg, children, sx }) => (
  <span style={{
    display:'inline-flex', alignItems:'center', gap:4,
    padding:'3px 9px', borderRadius:5,
    fontSize:11, fontWeight:500, letterSpacing:'0.03em',
    color, background: bg || color+'1a', fontFamily:I, ...sx,
  }}>{children}</span>
);

const Dot = ({ type='verified', label }) => {
  const m = { verified:{ch:'●',c:T.emerald}, inferred:{ch:'◐',c:T.amber}, suggested:{ch:'○',c:T.t3} }[type];
  return (
    <span style={{fontSize:12,fontWeight:500,color:m.c,fontFamily:'monospace',display:'inline-flex',alignItems:'center',gap:5}}>
      <span style={{fontSize:9}}>{m.ch}</span>{label||type}
    </span>
  );
};

const Card = ({ children, style, onClick, hover }) => {
  const [h,setH] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={()=>(hover||onClick)&&setH(true)} onMouseLeave={()=>setH(false)}
      style={{ background:T.s1, border:`1px solid ${h?T.borderH:T.border}`, borderRadius:14, padding:28,
               cursor:onClick?'pointer':'default', transition:'border-color .15s', ...style }}>
      {children}
    </div>
  );
};

const SLabel = ({ children }) => (
  <p style={{fontSize:11,fontWeight:600,color:T.t3,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:14,fontFamily:I}}>{children}</p>
);

const Bar = ({ value, color=T.primary, h=4 }) => (
  <div style={{height:h,background:T.s3,borderRadius:h/2,overflow:'hidden'}}>
    <div style={{height:'100%',width:`${value}%`,background:color,transition:'width .5s ease',borderRadius:h/2}}/>
  </div>
);

const Spinner = ({size=14}) => (
  <span className="spin" style={{display:'inline-block',width:size,height:size,border:`2px solid ${T.s3}`,borderTopColor:T.primary,borderRadius:'50%'}}/>
);

/* ── Button ── */
const Btn = ({ children, onClick, disabled, variant='primary', size='md', sx }) => {
  const [p,setP] = useState(false);
  const sz = { sm:{padding:'7px 14px',fontSize:13,minHeight:34}, md:{padding:'10px 22px',fontSize:14,minHeight:42}, lg:{padding:'13px 32px',fontSize:15,minHeight:50} }[size];
  const vr = {
    primary: { background:disabled?T.s3:p?T.primaryH:T.primary, color:disabled?T.t3:T.t1, border:'none' },
    ghost:   { background:'transparent', color:disabled?T.t3:T.t2, border:`1px solid ${T.border}` },
    success: { background:p?'#059669':T.emerald, color:T.t1, border:'none' },
    subtle:  { background:T.s2, color:T.t2, border:`1px solid ${T.border}` },
  }[variant];
  return (
    <button onClick={disabled?undefined:onClick} onMouseDown={()=>setP(true)} onMouseUp={()=>setP(false)} onMouseLeave={()=>setP(false)} disabled={disabled}
      style={{ display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,borderRadius:9,fontFamily:I,fontWeight:500,
               cursor:disabled?'not-allowed':'pointer',transition:'background .12s,transform .1s',
               transform:p&&!disabled?'scale(0.98)':'scale(1)',userSelect:'none',letterSpacing:'-0.01em',
               ...sz,...vr,...sx }}>
      {children}
    </button>
  );
};

/* ── Stat card ── */
const Stat = ({ label, value, sub, color=T.t1, hero }) => (
  <div style={{
    padding: hero?'24px 28px':'18px 22px',
    background: color===T.emerald?T.e10:color===T.primary?T.p10:color===T.amber?T.a10:T.s1,
    border:`1px solid ${color===T.t1?T.border:color+'30'}`, borderRadius:12,
  }}>
    <p style={{fontSize:11,fontWeight:600,color:T.t3,letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:6}}>{label}</p>
    <p style={{fontFamily:G,fontSize:hero?48:28,fontWeight:700,color,lineHeight:1,marginBottom:sub?4:0}}>{value}</p>
    {sub && <p style={{fontSize:12,color:T.t3,marginTop:4}}>{sub}</p>}
  </div>
);

/* ═══════ SCREENS ═══════ */

/* 0 · Feasibility */
const S0 = () => {
  const risks = [
    { level:'Low',    label:'Data availability',  detail:'All 3 required tables exist in prod',              color:T.emerald },
    { level:'Low',    label:'API surface',         detail:'Read-only — no write endpoints touched',            color:T.emerald },
    { level:'Medium', label:'A/B test collision',  detail:'Expert Picks overlaps 2 live experiments',          color:T.amber  },
    { level:'Low',    label:'Rollback complexity', detail:'Feature flag in place, kill-switch ready',           color:T.emerald },
  ];
  return (
    <div style={{display:'flex',flexDirection:'column',gap:32}}>
      <div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <Tag color={T.emerald}>Ready to build</Tag>
          <Tag color={T.t3}>Expert Picks · Home Screen</Tag>
        </div>
        <h1 style={{fontFamily:G,fontSize:36,fontWeight:700,color:T.t1,lineHeight:1.2,marginBottom:8}}>Can we build this?</h1>
        <p style={{color:T.t2,fontSize:16,maxWidth:560}}>Artisan checked 847 data points across your codebase, past PRs, and team velocity.</p>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr',gap:16}}>
        <Stat hero label="Feasibility score" value="92%" sub="847 data points checked" color={T.emerald}/>
        <Stat label="Estimated effort" value="4 days" sub="Based on 3 similar PRs" color={T.primary}/>
        <Stat label="Overall risk" value="Low" sub="1 medium risk identified" color={T.amber}/>
      </div>

      <Card>
        <SLabel>Risk breakdown</SLabel>
        <div style={{display:'flex',flexDirection:'column'}}>
          {risks.map((r,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:16,padding:'13px 0',borderBottom:i<risks.length-1?`1px solid ${T.border}`:'none'}}>
              <Tag color={r.color} sx={{minWidth:64,justifyContent:'center'}}>{r.level}</Tag>
              <span style={{fontSize:14,fontWeight:500,color:T.t1,flex:1}}>{r.label}</span>
              <span style={{fontSize:13,color:T.t3}}>{r.detail}</span>
            </div>
          ))}
        </div>
      </Card>

      <Card>
        <SLabel>Closest shipped feature</SLabel>
        <div style={{display:'flex',alignItems:'center',gap:16}}>
          <div style={{width:44,height:44,borderRadius:10,background:T.p10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <svg width="20" height="20" fill="none" stroke={T.primary} strokeWidth="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div style={{flex:1}}>
            <p style={{fontSize:15,fontWeight:500,color:T.t1}}>Trending Shelf · Q3 2024</p>
            <p style={{fontSize:13,color:T.t3,marginTop:2}}>Similar data shape · Shipped in 3.5 days · 0 post-ship incidents</p>
          </div>
          <Dot type="verified" label="verified match"/>
        </div>
      </Card>

      <div style={{padding:'14px 20px',background:T.p10,borderRadius:10,border:`1px solid ${T.primary}25`}}>
        <p style={{fontSize:14,color:T.primary}}>No blockers. Artisan has everything it needs to proceed.</p>
      </div>
    </div>
  );
};

/* 1 · Requirements */
const S1 = () => {
  const [open,setOpen] = useState(null);
  const reqs = [
    { id:0, status:'confirmed', label:'Show top 5 expert-curated items per category',         source:'product-spec-v4.docx · Line 23 · Cross-referenced with Figma mock #88' },
    { id:1, status:'inferred',  label:'Refresh picks every 24 hours, not real-time',           source:'Inferred from analytics — real-time would spike infra cost 4×' },
    { id:2, status:'gap',       label:'What happens if a category has fewer than 5 experts?',  source:null },
    { id:3, status:'confirmed', label:'Respect personalisation exclusions (blocked brands, dietary)', source:'Found in shared personalisation lib · Already used by Trending Shelf' },
  ];
  const dot = { confirmed:{ch:'●',c:T.emerald}, inferred:{ch:'◐',c:T.amber}, gap:{ch:'?',c:T.red} };
  return (
    <div style={{display:'flex',flexDirection:'column',gap:32}}>
      <div>
        <h1 style={{fontFamily:G,fontSize:36,fontWeight:700,color:T.t1,lineHeight:1.2,marginBottom:8}}>What exactly are we building?</h1>
        <p style={{color:T.t2,fontSize:16}}>Artisan read the spec, the Figma file, and 14 Slack threads. Here's what it understood — and what's still unclear.</p>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {reqs.map((r)=>{
          const d = dot[r.status];
          const isOpen = open===r.id;
          return (
            <Card key={r.id} onClick={()=>r.source&&setOpen(isOpen?null:r.id)} hover={!!r.source}
              style={{padding:'18px 22px',borderColor:r.status==='gap'?T.red+'35':undefined}}>
              <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
                <span style={{fontFamily:'monospace',fontSize:10,color:d.c,marginTop:4,flexShrink:0}}>{d.ch}</span>
                <div style={{flex:1}}>
                  <p style={{fontSize:14,fontWeight:500,color:T.t1,lineHeight:1.5}}>{r.label}</p>
                  {r.status==='gap'&&<p style={{fontSize:12,color:T.red,marginTop:4}}>Safe default applied — click to review</p>}
                  {isOpen&&r.source&&(
                    <div style={{marginTop:10,padding:'10px 14px',background:T.s2,borderRadius:8,animation:'fadeUp .15s ease'}}>
                      <p style={{fontSize:12,color:T.t2,lineHeight:1.5}}>{r.source}</p>
                    </div>
                  )}
                </div>
                {r.source&&<span style={{color:T.t2,fontSize:14,marginTop:2}}>{isOpen?'▲':'▼'}</span>}
              </div>
            </Card>
          );
        })}
      </div>

      <Card style={{borderColor:T.amber+'35',background:T.amber+'06',padding:'18px 22px'}}>
        <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
          <span style={{color:T.amber,fontSize:20}}>⚠</span>
          <div>
            <p style={{fontSize:14,fontWeight:600,color:T.amber,marginBottom:4}}>1 gap found — safe default applied</p>
            <p style={{fontSize:13,color:T.t2,lineHeight:1.55}}>Fewer than 5 experts in a category → show all available items. Flagged for your review before merge.</p>
          </div>
        </div>
      </Card>

      <div style={{display:'flex',gap:20}}>
        <Dot type="verified" label="3 confirmed"/>
        <Dot type="inferred" label="1 resolved with safe default"/>
      </div>
    </div>
  );
};

/* 2 · Data Sources */
const S2 = () => {
  const [legendOpen,setLegendOpen] = useState(false);
  const sources = [
    { name:'expert_picks',     db:'prod_catalog', type:'found · reusing', tc:T.emerald, rows:'12,400 rows', fresh:'Updated 2h ago', use:'Primary data source' },
    { name:'user_preferences', db:'prod_users',   type:'found · reusing', tc:T.emerald, rows:'2.1M rows',  fresh:'Live',           use:'Personalisation exclusions' },
    { name:'category_weights', db:'—',            type:'two candidates',  tc:T.amber,   rows:null,         fresh:null,             use:'Ranking input — needs your decision' },
  ];
  return (
    <div style={{display:'flex',flexDirection:'column',gap:32}}>
      <div>
        <h1 style={{fontFamily:G,fontSize:36,fontWeight:700,color:T.t1,lineHeight:1.2,marginBottom:8}}>Where does the data come from?</h1>
        <p style={{color:T.t2,fontSize:16}}>Every number Artisan uses has a traceable origin. Nothing assumed, nothing hidden.</p>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {sources.map((s,i)=>(
          <Card key={i} style={{padding:'20px 24px'}}>
            <div style={{display:'flex',gap:20,alignItems:'flex-start'}}>
              <code style={{fontSize:13,color:T.primary,background:T.p10,padding:'4px 10px',borderRadius:6,flexShrink:0,marginTop:2,fontFamily:'monospace'}}>{s.name}</code>
              <div style={{flex:1}}>
                <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:4}}>
                  <Tag color={s.tc}>{s.type}</Tag>
                  {s.fresh&&<span style={{fontSize:12,color:T.t3}}>{s.db} · {s.rows} · {s.fresh}</span>}
                </div>
                <p style={{fontSize:13,color:T.t2}}>{s.use}</p>
                {s.type==='two candidates'&&(
                  <div style={{marginTop:12,padding:'12px 16px',background:T.a10,borderRadius:8,border:`1px solid ${T.amber}25`}}>
                    <p style={{fontSize:12,color:T.amber,marginBottom:10}}>Two tables match — which did you mean?</p>
                    <div style={{display:'flex',gap:8}}>
                      <Btn variant="subtle" size="sm">catalog.category_weights</Btn>
                      <Btn variant="subtle" size="sm">ranking.category_weights</Btn>
                    </div>
                  </div>
                )}
              </div>
              <Dot type={s.type==='found · reusing'?'verified':'inferred'}/>
            </div>
          </Card>
        ))}
      </div>

      <div onClick={()=>setLegendOpen(o=>!o)}
        style={{padding:'12px 18px',background:T.s1,border:`1px solid ${T.border}`,borderRadius:10,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:13,color:T.t3}}>What do these labels mean?</span>
        <span style={{fontSize:13,color:T.t3}}>{legendOpen?'▲':'▼'}</span>
      </div>
      {legendOpen&&(
        <Card style={{animation:'fadeUp .15s ease',padding:'18px 24px'}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {[['found · reusing',T.emerald,'Exists in prod, already used by other features'],
              ['found · asking', T.primary,'Exists but Artisan needs your permission to read'],
              ['two candidates', T.amber,  'Two tables match — you decide which one'],
              ['does not exist', T.red,    'Artisan will create and seed the table for you'],
            ].map(([l,c,d])=>(
              <div key={l} style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                <Tag color={c}>{l}</Tag>
                <span style={{fontSize:12,color:T.t3,lineHeight:1.4,marginTop:3}}>{d}</span>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
};

/* 3 · The Plan */
const S3 = () => (
  <div style={{display:'flex',flexDirection:'column',gap:32}}>
    <div>
      <h1 style={{fontFamily:G,fontSize:36,fontWeight:700,color:T.t1,lineHeight:1.2,marginBottom:8}}>The plan, in plain language</h1>
      <p style={{color:T.t2,fontSize:16}}>This is exactly what Artisan will build. Read it carefully — push back on anything that doesn't match your intent.</p>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>
      <Card>
        <SLabel>Feature summary</SLabel>
        <p style={{fontSize:15,color:T.t1,lineHeight:1.7}}>
          Expert Picks shows the top 5 curator-selected items per category on the home screen. Items refresh every 24 hours via a scheduled job. Personalisation exclusions (blocked brands, dietary preferences) are respected. When a category has fewer than 5 experts, all available items are shown.
        </p>
      </Card>
      <Card>
        <SLabel>What Artisan will do</SLabel>
        <div>
          {[['Query expert_picks, filter by category','Read'],
            ['Apply personalisation exclusions','Read'],
            ['Sort by curator_score, return top 5','Logic'],
            ['Cache per user segment (TTL 24h)','Write'],
            ['Add ExpertPicksShelf to HomeScreen','UI'],
            ['Feature flag: EXPERT_PICKS_ENABLED','Config'],
          ].map(([step,type],i,arr)=>(
            <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start',paddingBottom:i<arr.length-1?14:0}}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',width:20,flexShrink:0}}>
                <div style={{width:20,height:20,borderRadius:'50%',background:T.p10,border:`1.5px solid ${T.primary}40`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <span style={{fontSize:9,color:T.primary,fontWeight:700}}>{i+1}</span>
                </div>
                {i<arr.length-1&&<div style={{width:1.5,flex:1,background:T.borderH,marginTop:3}}/>}
              </div>
              <div style={{paddingTop:2}}>
                <span style={{fontSize:13,color:T.t1}}>{step}</span>
                <Tag color={T.t3} sx={{marginLeft:8}}>{type}</Tag>
              </div>
            </div>
          ))}
        </div>
      </Card>
    </div>

    <div style={{display:'flex',gap:12}}>
      <Btn size="lg">Yes, this is correct — build it</Btn>
      <Btn variant="ghost" size="lg">Something's wrong</Btn>
    </div>
  </div>
);

/* 4 · Handoff */
const S4 = () => {
  const [choice,setChoice] = useState('review');
  const opts = [
    { id:'review',      icon:'✓', title:'Review when done',    sub:'Artisan builds, you approve before merge',      badge:'Recommended', detail:'Artisan runs to completion, then shows a full summary. You sign off or request changes. Nothing merges without your approval.' },
    { id:'watch',       icon:'👁', title:'Watch live',          sub:'Follow Artisan step-by-step as it builds',      badge:null,          detail:'Every decision visible in real time. Artisan pauses and asks before anything risky.' },
    { id:'engineering', icon:'↗', title:'Hand to engineering', sub:'Forward the spec + full context to your EM',    badge:null,          detail:'Artisan generates a complete engineering brief with every data point it gathered. Your EM picks it up from here.' },
  ];
  return (
    <div style={{display:'flex',flexDirection:'column',gap:32}}>
      <div>
        <h1 style={{fontFamily:G,fontSize:36,fontWeight:700,color:T.t1,lineHeight:1.2,marginBottom:8}}>How involved do you want to be?</h1>
        <p style={{color:T.t2,fontSize:16}}>All three routes get to the same place. Pick how much you want to see along the way.</p>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>
        {opts.map((o)=>{
          const sel = choice===o.id;
          return (
            <div key={o.id} onClick={()=>setChoice(o.id)} style={{
              background:sel?T.p10:T.s1, border:`1.5px solid ${sel?T.primary:T.border}`,
              borderRadius:14, padding:'22px 22px 20px', cursor:'pointer',
              transition:'border-color .15s,background .15s', display:'flex',flexDirection:'column',gap:12,
            }}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{width:40,height:40,borderRadius:10,background:sel?T.primary+'25':T.s2,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{o.icon}</div>
                {o.badge&&<Tag color={T.primary}>{o.badge}</Tag>}
              </div>
              <div>
                <p style={{fontSize:15,fontWeight:600,color:T.t1,marginBottom:4}}>{o.title}</p>
                <p style={{fontSize:13,color:T.t2,lineHeight:1.5}}>{o.sub}</p>
              </div>
              {sel&&(
                <div style={{padding:'10px 14px',background:T.s2,borderRadius:8,animation:'fadeUp .15s ease'}}>
                  <p style={{fontSize:12,color:T.t2,lineHeight:1.55}}>{o.detail}</p>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <Btn size="lg">
        {choice==='watch'?'Start watching →':choice==='review'?'Build and notify me →':'Generate engineering brief →'}
      </Btn>
    </div>
  );
};

/* 5 · Live Build */
const S5 = () => {
  const steps = [
    { status:'done',    label:'Read expert_picks schema',                  time:'0:04', detail:'3 tables · 12 columns' },
    { status:'done',    label:'Confirm personalisation lib is compatible', time:'0:09', detail:'Version 2.4.1 ✓' },
    { status:'active',  label:'Writing ExpertPicksShelf component',        time:'now',  detail:null },
    { status:'pending', label:'Write API endpoint /picks/{category}',      time:null,   detail:null },

      <Stat label="Users affected" value="0" sub="No errors" color={T.t1}/>
    </div>

    <Card>
      <SLabel>Rollout plan</SLabel>
      {[{ label:'5% — complete', done:true, active:false },
        { label:'20% — Artisan recommends now', done:false, active:true },
        { label:'100% — after 24h stable at 20%', done:false, active:false },
      ].map((r,i,arr)=>(
        <div key={i} style={{display:'flex',gap:16,alignItems:'center',padding:'14px 0',borderBottom:i<arr.length-1?`1px solid ${T.border}`:'none'}}>
          <span style={{fontFamily:'monospace',fontSize:12,color:r.done?T.emerald:r.active?T.primary:T.t3}}>
            {r.done?'●':r.active?'◎':'○'}
          </span>
          <span style={{fontSize:14,color:r.active?T.t1:T.t2,fontWeight:r.active?500:400,flex:1}}>{r.label}</span>
          {r.active&&<Tag color={T.primary}>Ready</Tag>}
        </div>
      ))}
    </Card>

    <div style={{display:'flex',gap:12}}>
      <Btn variant="success" size="lg">Expand to 20%</Btn>
      <Btn variant="ghost" size="lg">View full report</Btn>
    </div>
  </div>
);

/* ═══════ SCREEN REGISTRY ═══════ */
const SCREENS = [
  { name:'Feasibility',      Component:S0  },
  { name:'Requirements',     Component:S1  },
  { name:'Data sources',     Component:S2  },
  { name:'The plan',         Component:S3  },
  { name:'Handoff',          Component:S4  },
  { name:'Live build',       Component:S5  },
  { name:'Self-corrections', Component:S6  },
  { name:'Your changes',     Component:S7  },
  { name:'Evidence',         Component:S8  },
  { name:'Safety net',       Component:S9  },
  { name:'Ship moment',      Component:S10 },
  { name:'24h report',       Component:S11 },
];

/* ═══════ APP SHELL — Desktop: sidebar + scrollable content ═══════ */
const App = () => {
  const [screen,setScreen] = useState(0);
  const [animKey,setAnimKey] = useState(0);
  const total = SCREENS.length;

  const go = useCallback((n)=>{
    if(n<0||n>=total) return;
    setScreen(n);
    setAnimKey(k=>k+1);
  },[total]);

  useEffect(()=>{
    const h = (e)=>{ if(e.key==='ArrowRight') go(screen+1); if(e.key==='ArrowLeft') go(screen-1); };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[screen,go]);

  const { Component } = SCREENS[screen];
  const pct = ((screen+1)/total)*100;

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden',background:T.bg}}>

      {/* ── Sidebar ── */}
      <aside style={{
        width:232, flexShrink:0,
        background:T.s1, borderRight:`1px solid ${T.border}`,
        display:'flex', flexDirection:'column', overflow:'hidden',
      }}>
        {/* Brand */}
        <div style={{padding:'24px 24px 16px',borderBottom:`1px solid ${T.border}`}}>
          <p style={{fontFamily:G,fontSize:15,fontWeight:700,color:T.t1,letterSpacing:'-0.02em'}}>Artisan</p>
          <p style={{fontSize:11,color:T.t3,marginTop:2}}>PM Shipping Flow</p>
        </div>

        {/* Progress */}
        <div style={{padding:'14px 24px',borderBottom:`1px solid ${T.border}`}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <span style={{fontSize:11,color:T.t3}}>Progress</span>
            <span style={{fontSize:11,color:T.t2,fontFamily:'monospace'}}>{screen+1} / {total}</span>
          </div>
          <Bar value={pct}/>
        </div>

        {/* Nav */}
        <nav style={{flex:1,overflowY:'auto',padding:'10px 10px'}}>
          {SCREENS.map((s,i)=>{
            const active = screen===i;
            const done = i<screen;
            return (
              <button key={i} onClick={()=>go(i)} style={{
                width:'100%', textAlign:'left', display:'flex', alignItems:'center', gap:10,
                padding:'8px 12px', borderRadius:8, border:'none',
                background:active?T.p10:'transparent',
                cursor:'pointer', transition:'background .12s', marginBottom:1,
              }}>
                <span style={{
                  width:20,height:20,borderRadius:'50%',flexShrink:0,
                  display:'flex',alignItems:'center',justifyContent:'center',
                  fontSize:9,fontFamily:'monospace',
                  background:active?T.primary:done?T.e10:T.s2,
                  border:`1.5px solid ${active?T.primary:done?T.emerald:T.border}`,
                  color:active?T.t1:done?T.emerald:T.t3,
                }}>
                  {done?'✓':i+1}
                </span>
                <span style={{fontSize:13,fontWeight:active?500:400,color:active?T.t1:done?T.t2:T.t3}}>
                  {s.name}
                </span>
              </button>
            );
          })}
        </nav>

        {/* Keyboard hint */}
        <div style={{padding:'12px 24px',borderTop:`1px solid ${T.border}`}}>
          <p style={{fontSize:11,color:T.t3}}>
            <kbd style={{background:T.s2,border:`1px solid ${T.border}`,borderRadius:4,padding:'1px 5px',fontFamily:'monospace',fontSize:10}}>←</kbd>
            {' '}<kbd style={{background:T.s2,border:`1px solid ${T.border}`,borderRadius:4,padding:'1px 5px',fontFamily:'monospace',fontSize:10}}>→</kbd>
            {' '}to navigate
          </p>
        </div>
      </aside>

      {/* ── Content area ── */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>

        {/* Top bar */}
        <header style={{
          height:54,flexShrink:0,
          display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'0 48px',
          borderBottom:`1px solid ${T.border}`,
          background:T.bg,
        }}>
          <p style={{fontSize:14,fontWeight:500,color:T.t1}}>{SCREENS[screen].name}</p>
          <div style={{display:'flex',gap:8}}>
            <Btn variant="ghost" size="sm" onClick={()=>go(screen-1)} disabled={screen===0}>← Back</Btn>
            <Btn size="sm" onClick={()=>go(screen+1)} disabled={screen===total-1}>Next →</Btn>
          </div>
        </header>

        {/* Thin progress line */}
        <div style={{height:2,background:T.s2,flexShrink:0}}>
          <div style={{height:'100%',width:`${pct}%`,background:T.primary,transition:'width .4s ease'}}/>
        </div>

        {/* Scrollable content */}
        <main role="main" style={{flex:1,overflowY:'auto',padding:'52px 64px 72px'}}>
          <div style={{maxWidth:900}}>
            <div key={animKey} className="screen-enter">
              <Component/>
            </div>
          </div>
        </main>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
