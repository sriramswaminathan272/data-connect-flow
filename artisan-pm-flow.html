<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artisan · PM Shipping Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #030712;
  --s1: #0F172A;
  --s2: #1E293B;
  --s3: #263145;
  --border: #1E293B;
  --border-h: #334155;
  --primary: #4F46E5;
  --primary-h: #4338CA;
  --primary-10: rgba(79,70,229,0.10);
  --primary-20: rgba(79,70,229,0.20);
  --emerald: #10B981;
  --emerald-10: rgba(16,185,129,0.10);
  --amber: #F59E0B;
  --amber-10: rgba(245,158,11,0.10);
  --red: #EF4444;
  --red-10: rgba(239,68,68,0.10);
  --violet: #8B5CF6;
  --t1: #F8FAFC;
  --t2: #94A3B8;
  --t3: #475569;
}

html, body { height: 100%; background: var(--bg); }

body {
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--t1);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.6;
  font-size: 16px;
}

#root { height: 100%; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 2px; }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes progressFill {
  from { width: 0; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}

.screen-enter { animation: fadeUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
.pulse-dot { animation: pulse 1.8s ease-in-out infinite; }
.spin { animation: spin 1s linear infinite; }

/* Focus styles — accessibility */
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: 6px;
}

/* Remove 300ms tap delay on mobile */
button, a, [role="button"] { touch-action: manipulation; }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useCallback, useRef } = React;

/* ─────────────────────────────── TOKENS ─────────────────────────────── */
const T = {
  bg: '#030712', s1: '#0F172A', s2: '#1E293B', s3: '#263145',
  border: '#1E293B', borderH: '#334155',
  primary: '#4F46E5', primaryH: '#4338CA', primary10: 'rgba(79,70,229,0.10)', primary20: 'rgba(79,70,229,0.20)',
  emerald: '#10B981', emerald10: 'rgba(16,185,129,0.10)',
  amber: '#F59E0B', amber10: 'rgba(245,158,11,0.10)',
  red: '#EF4444', red10: 'rgba(239,68,68,0.10)',
  violet: '#8B5CF6',
  t1: '#F8FAFC', t2: '#94A3B8', t3: '#475569',
};

const font = { grotesk: "'Space Grotesk', sans-serif", inter: "'Inter', sans-serif" };

/* ─────────────────────────────── PRIMITIVES ─────────────────────────── */

const Tag = ({ color = T.t3, bg, children, icon }) => (
  <span style={{
    display: 'inline-flex', alignItems: 'center', gap: 4,
    padding: '3px 8px', borderRadius: 5,
    fontSize: 11, fontWeight: 500, letterSpacing: '0.02em',
    color, background: bg || color + '18',
    fontFamily: font.inter,
  }}>
    {icon && <span style={{ fontSize: 9 }}>{icon}</span>}
    {children}
  </span>
);

const Verified = ({ label, type = 'verified' }) => {
  const map = {
    verified: { dot: '●', color: T.emerald, label: label || 'verified' },
    inferred: { dot: '◐', color: T.amber,   label: label || 'inferred' },
    suggested:{ dot: '○', color: T.t3,      label: label || 'suggested' },
  };
  const m = map[type];
  return (
    <span style={{ fontSize: 13, fontWeight: 500, color: m.color, fontFamily: 'monospace', letterSpacing: '0.01em', display: 'inline-flex', alignItems: 'center', gap: 4 }}>
      <span style={{ fontSize: 10 }}>{m.dot}</span> {m.label}
    </span>
  );
};

const Divider = () => (
  <div style={{ height: 1, background: T.border, margin: '20px 0' }} />
);

/* Card component — the core container */
const Card = ({ children, style, hover }) => {
  const [hovered, setHovered] = useState(false);
  return (
    <div
      onMouseEnter={() => hover && setHovered(true)}
      onMouseLeave={() => hover && setHovered(false)}
      style={{
        background: T.s1,
        border: `1px solid ${hovered ? T.borderH : T.border}`,
        borderRadius: 16,
        padding: 24,
        transition: 'border-color 0.15s ease',
        ...style,
      }}
    >
      {children}
    </div>
  );
};

/* Progress bar inside a card */
const ProgressBar = ({ value, color = T.primary, bg = T.s2, height = 6 }) => (
  <div style={{ height, background: bg, borderRadius: height / 2, overflow: 'hidden' }}>
    <div style={{
      height: '100%', width: `${value}%`,
      background: color, borderRadius: height / 2,
      transition: 'width 0.6s ease',
    }} />
  </div>
);

/* Score pill */
const ScorePill = ({ label, value, color = T.primary }) => (
  <div style={{
    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
    padding: '12px 20px', background: color + '15',
    border: `1px solid ${color}30`, borderRadius: 12,
    minWidth: 90,
  }}>
    <span style={{ fontSize: 24, fontWeight: 700, fontFamily: font.grotesk, color, lineHeight: 1 }}>{value}</span>
    <span style={{ fontSize: 11, color: T.t2, letterSpacing: '0.04em', textTransform: 'uppercase' }}>{label}</span>
  </div>
);

/* Inline spinner */
const Spinner = ({ size = 16 }) => (
  <span className="spin" style={{
    display: 'inline-block',
    width: size, height: size,
    border: `2px solid ${T.s2}`,
    borderTopColor: T.primary,
    borderRadius: '50%',
  }} />
);

/* ─────────────────────────────── BUTTON ──────────────────────────────── */
const Btn = ({ children, onClick, disabled, variant = 'primary', size = 'md', style: sx }) => {
  const [pressed, setPressed] = useState(false);
  const sizes = {
    sm: { padding: '8px 14px', fontSize: 13, minHeight: 34 },
    md: { padding: '11px 20px', fontSize: 14, minHeight: 44 },
    lg: { padding: '14px 28px', fontSize: 15, minHeight: 52 },
  };
  const variants = {
    primary: {
      background: disabled ? T.s2 : pressed ? T.primaryH : T.primary,
      color: disabled ? T.t3 : T.t1,
      border: 'none',
    },
    ghost: {
      background: 'transparent',
      color: disabled ? T.t3 : T.t2,
      border: `1px solid ${T.border}`,
    },
    danger: {
      background: pressed ? '#DC2626' : T.red,
      color: T.t1,
      border: 'none',
    },
    success: {
      background: pressed ? '#059669' : T.emerald,
      color: T.t1,
      border: 'none',
    },
  };
  return (
    <button
      onClick={disabled ? undefined : onClick}
      onMouseDown={() => setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onMouseLeave={() => setPressed(false)}
      disabled={disabled}
      style={{
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 7,
        borderRadius: 10,
        fontFamily: font.inter, fontWeight: 500,
        cursor: disabled ? 'not-allowed' : 'pointer',
        transition: 'background 0.12s ease, transform 0.1s ease',
        transform: pressed && !disabled ? 'scale(0.98)' : 'scale(1)',
        userSelect: 'none',
        ...sizes[size],
        ...variants[variant],
        ...sx,
      }}
    >
      {children}
    </button>
  );
};

/* ─────────────────────────────── SCREENS ─────────────────────────────── */

/* ── Screen 0: Feasibility Card ── */
const FeasibilityScreen = () => {
  const risks = [
    { level: 'Low', label: 'Data availability', detail: 'All 3 required tables exist in prod', color: T.emerald },
    { level: 'Low', label: 'API impact', detail: 'Read-only change, no write endpoints touched', color: T.emerald },
    { level: 'Medium', label: 'A/B test collision', detail: 'Expert Picks overlaps with 2 live experiments', color: T.amber },
    { level: 'Low', label: 'Rollback complexity', detail: 'Feature flag exists, kill-switch ready', color: T.emerald },
  ];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
          <Tag color={T.emerald} bg={T.emerald + '15'}>Ready to build</Tag>
          <Tag color={T.t3}>Expert Picks · Home Screen</Tag>
        </div>
        <h1 style={{ fontFamily: font.grotesk, fontSize: 26, fontWeight: 700, color: T.t1, lineHeight: 1.25, marginBottom: 6 }}>
          Can we build this?
        </h1>
        <p style={{ color: T.t2, fontSize: 15, lineHeight: 1.6 }}>
          Artisan checked 847 data points across your codebase, past PRs, and team velocity.
        </p>
      </div>

      {/* Hero score — dominant visual (Von Restorff: the standout number anchors trust) */}
      <div style={{
        padding: '20px 24px', borderRadius: 16,
        background: `linear-gradient(135deg, ${T.emerald}18 0%, ${T.emerald}08 100%)`,
        border: `1px solid ${T.emerald}30`,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      }}>
        <div>
          <p style={{ fontSize: 13, color: T.emerald, fontWeight: 500, marginBottom: 4 }}>Feasibility score</p>
          <p style={{ fontFamily: font.grotesk, fontSize: 52, fontWeight: 700, color: T.emerald, lineHeight: 1 }}>92%</p>
          <p style={{ fontSize: 12, color: T.t3, marginTop: 4 }}>847 data points checked</p>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'flex-end' }}>
          <ScorePill label="Effort" value="4 days" color={T.primary} />
          <ScorePill label="Risk" value="Low" color={T.amber} />
        </div>
      </div>

      {/* Risk breakdown */}
      <Card>
        <p style={{ fontSize: 12, fontWeight: 600, color: T.t3, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 14 }}>
          Risk breakdown
        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {risks.map((r, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
              <Tag color={r.color} bg={r.color + '15'}>{r.level}</Tag>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 500, color: T.t1 }}>{r.label}</div>
                <div style={{ fontSize: 12, color: T.t3, marginTop: 2 }}>{r.detail}</div>
              </div>
            </div>
          ))}
        </div>
      </Card>

      {/* Comparable work */}
      <Card>
        <p style={{ fontSize: 12, fontWeight: 600, color: T.t3, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 14 }}>
          Closest shipped feature
        </p>
        <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
          <div style={{
            width: 40, height: 40, borderRadius: 10, background: T.primary10,
            display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
          }}>
            <svg width="18" height="18" fill={T.primary} viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <div>
            <div style={{ fontSize: 14, fontWeight: 500, color: T.t1 }}>Trending Shelf · Q3 2024</div>
            <div style={{ fontSize: 12, color: T.t3, marginTop: 2 }}>Similar data shape · Shipped in 3.5 days · 0 incidents</div>
          </div>
          <Verified type="verified" />
        </div>
      </Card>

      <div style={{ padding: '12px 16px', background: T.primary10, borderRadius: 10, border: `1px solid ${T.primary}25` }}>
        <p style={{ fontSize: 13, color: T.primary, lineHeight: 1.5 }}>
          Artisan found everything it needs to proceed. No blockers.
        </p>
      </div>
    </div>
  );
};

/* ── Screen 1: Requirements Discovery ── */
const RequirementsScreen = () => {
  const [expanded, setExpanded] = useState(null);
  const reqs = [
    {
      id: 0, status: 'confirmed', label: 'Show top 5 expert-curated items per category',
      detail: 'Source: product-spec-v4.docx · Line 23 · Cross-checked with design mock #88',
      source: 'spec',
    },
    {
      id: 1, status: 'confirmed', label: 'Refresh picks every 24 hours, not real-time',
      detail: 'Inferred from analytics dashboard — real-time would spike costs 4×',
      source: 'inferred',
    },
    {
      id: 2, status: 'question', label: 'What happens if a category has fewer than 5 experts?',
      detail: null,
      source: 'gap',
    },
    {
      id: 3, status: 'confirmed', label: 'Respect personalisation exclusions (blocked brands, dietary)',
      detail: 'Found in shared personalisation lib · Already used by Trending Shelf',
      source: 'code',
    },
  ];

  const statusStyle = {
    confirmed: { dot: '●', color: T.emerald },
    question: { dot: '?', color: T.amber },
    gap: { dot: '!', color: T.red },
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <div>
        <Tag color={T.primary} style={{ marginBottom: 8 }}>Step 2 of 12</Tag>
        <h1 style={{ fontFamily: font.grotesk, fontSize: 26, fontWeight: 700, color: T.t1, lineHeight: 1.25, marginBottom: 6 }}>
          What exactly are we building?
        </h1>
        <p style={{ color: T.t2, fontSize: 15, lineHeight: 1.6 }}>
          Artisan read the spec, the Figma file, and 14 Slack threads. Here's what it understood.
        </p>
      </div>

      {/* Requirements list */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {reqs.map((r) => {
          const s = statusStyle[r.status] || statusStyle.confirmed;
          const isOpen = expanded === r.id;
          return (
            <div
              key={r.id}
              onClick={() => r.detail && setExpanded(isOpen ? null : r.id)}
              style={{
                background: T.s1, border: `1px solid ${isOpen ? T.borderH : T.border}`,
                borderRadius: 12, padding: '14px 16px',
                cursor: r.detail ? 'pointer' : 'default',
                transition: 'border-color 0.15s',
              }}
            >
              <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
                <span style={{ color: s.color, fontSize: 13, marginTop: 2, flexShrink: 0, fontFamily: 'monospace' }}>{s.dot}</span>
                <div style={{ flex: 1 }}>
                  <span style={{ fontSize: 14, color: T.t1, lineHeight: 1.5 }}>{r.label}</span>
                  {isOpen && r.detail && (
                    <div style={{ marginTop: 8, padding: '10px 12px', background: T.s2, borderRadius: 8 }}>
                      <p style={{ fontSize: 12, color: T.t2, lineHeight: 1.5 }}>{r.detail}</p>
                    </div>
                  )}
                </div>
                {r.detail && (
                  <span style={{ color: T.t3, fontSize: 11, marginTop: 3 }}>{isOpen ? '▲' : '▼'}</span>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* Gap resolution */}
      <Card style={{ borderColor: T.amber + '40', background: T.amber + '08' }}>
        <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
          <span style={{ fontSize: 18, marginTop: 2 }}>⚠</span>
          <div>
            <p style={{ fontSize: 14, fontWeight: 600, color: T.amber, marginBottom: 4 }}>1 gap found</p>
            <p style={{ fontSize: 13, color: T.t2, lineHeight: 1.5 }}>
              What happens when a category has fewer than 5 experts? Artisan will use a safe default (show all available) and flag this for your review before shipping.
            </p>
          </div>
        </div>
      </Card>

      <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
        <Verified type="verified" label="3 confirmed" />
        <Verified type="inferred" label="1 resolved with safe default" />
      </div>
    </div>
  );
};

/* ── Screen 2: Data Discovery ── */
const DataDiscoveryScreen = () => {
  const [legendOpen, setLegendOpen] = useState(false);
  const sources = [
    {
      name: 'expert_picks',
      db: 'prod_catalog',
      type: 'found · reusing',
      typeColor: T.emerald,
      rows: '12,400 rows',
      freshness: 'Updated 2h ago',
      usage: 'Primary data source',
    },
    {
      name: 'user_preferences',
      db: 'prod_users',
      type: 'found · reusing',
      typeColor: T.emerald,
      rows: '2.1M rows',
      freshness: 'Live',
      usage: 'Personalisation exclusions',
    },
    {
      name: 'category_weights',
      db: '—',
      type: 'two candidates',
      typeColor: T.amber,
      rows: null,
      freshness: null,
      usage: 'Ranking algorithm input',
    },
  ];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <div>
        <h1 style={{ fontFamily: font.grotesk, fontSize: 26, fontWeight: 700, color: T.t1, lineHeight: 1.25, marginBottom: 6 }}>
          Where does the data come from?
        </h1>
        <p style={{ color: T.t2, fontSize: 15, lineHeight: 1.6 }}>
          Every number Artisan uses has a traceable origin. Here's the full picture.
        </p>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {sources.map((s, i) => (
          <Card key={i} hover style={{ padding: '16px 20px' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <code style={{ fontSize: 13, color: T.primary, background: T.primary10, padding: '2px 8px', borderRadius: 5 }}>
                  {s.name}
                </code>
                <Tag color={s.typeColor} bg={s.typeColor + '18'}>{s.type}</Tag>
              </div>
              {s.db !== '—' && (
                <div style={{ display: 'flex', gap: 16 }}>
                  <span style={{ fontSize: 12, color: T.t3 }}>
                    <span style={{ color: T.t2 }}>{s.db}</span> · {s.rows}
                  </span>
                  <span style={{ fontSize: 12, color: T.t3 }}>{s.freshness}</span>
                </div>
              )}
              <p style={{ fontSize: 13, color: T.t2 }}>{s.usage}</p>
              {s.type === 'two candidates' && (
                <div style={{ padding: '10px 12px', background: T.amber10, borderRadius: 8, border: `1px solid ${T.amber}30` }}>
                  <p style={{ fontSize: 12, color: T.amber, marginBottom: 8 }}>Two tables match this name. Which did you mean?</p>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <Btn variant="ghost" size="sm">catalog.category_weights</Btn>
                    <Btn variant="ghost" size="sm">ranking.category_weights</Btn>
                  </div>
                </div>
              )}
            </div>
          </Card>
        ))}
      </div>

      {/* Progressive Disclosure: legend collapsed by default */}
      <div
        onClick={() => setLegendOpen(o => !o)}
        style={{
          padding: '12px 16px', background: T.s1,
          border: `1px solid ${T.border}`, borderRadius: 12,
          cursor: 'pointer', transition: 'border-color 0.15s',
        }}
      >
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <p style={{ fontSize: 13, color: T.t3, fontWeight: 500 }}>What do these labels mean?</p>
          <span style={{ color: T.t3, fontSize: 11 }}>{legendOpen ? '▲' : '▼'}</span>
        </div>
        {legendOpen && (
          <div style={{ marginTop: 12, display: 'flex', flexDirection: 'column', gap: 8, animation: 'fadeUp 0.15s ease both' }}>
            {[
              ['found · reusing', T.emerald, 'Exists in prod, already used by other features'],
              ['found · asking', T.primary, 'Exists, Artisan needs your permission to read'],
              ['two candidates', T.amber, 'Two tables match — you decide which one'],
              ['does not exist', T.red, 'Artisan will create and seed the table for you'],
            ].map(([label, color, desc]) => (
              <div key={label} style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
                <Tag color={color} bg={color + '18'}>{label}</Tag>
                <span style={{ fontSize: 12, color: T.t3, lineHeight: 1.4, marginTop: 3 }}>{desc}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

/* ── Screen 3: Spec Card ── */
const SpecScreen = () => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
    <div>
      <h1 style={{ fontFamily: font.grotesk, fontSize: 26, fontWeight: 700, color: T.t1, lineHeight: 1.25, marginBottom: 6 }}>
        The plan, in plain language
      </h1>
      <p style={{ color: T.t2, fontSize: 15, lineHeight: 1.6 }}>
        This is what Artisan will build. Read it. Push back on anything.
      </p>
    </div>

    <Card>
      <p style={{ fontSize: 12, fontWeight: 600, color: T.t3, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 14 }}>
        Feature summary
      </p>
      <p style={{ fontSize: 15, color: T.t1, lineHeight: 1.65 }}>
        Expert Picks shows the top 5 curator-selected items per category on the home screen.
        Items refresh every 24 hours via a scheduled job. Personalisation exclusions (blocked brands, dietary preferences) are respected.
        When a category has fewer than 5 experts, all available items are shown.
      </p>
    </Card>

    {/* Steps flow */}
    <Card>
      <p style={{ fontSize: 12, fontWeight: 600, color: T.t3, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 14 }}>
        What Artisan will do
      </p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
        {[
          ['Query expert_picks table, filter by category', 'Read'],
          ['Apply personalisation exclusions from user_preferences', 'Read'],
          ['Sort by curator_score, return top 5 per category', 'Logic'],
          ['Cache result per user segment (TTL 24h)', 'Write'],
          ['Add ExpertPicksShelf component to HomeScreen', 'UI'],
          ['Feature flag: EXPERT_PICKS_ENABLED', 'Config'],

/* ─────────────────────────────── SCREEN CONFIG ────────────────────────── */
const SCREENS = [
  { name: 'Feasibility',       Component: FeasibilityScreen },
  { name: 'Requirements',      Component: RequirementsScreen },
  { name: 'Data sources',      Component: DataDiscoveryScreen },
  { name: 'The plan',          Component: SpecScreen },
  { name: 'Handoff',           Component: HandoffScreen },
  { name: 'Live build',        Component: LiveBuildScreen },
  { name: 'Self-corrections',  Component: SelfCorrectionScreen },
  { name: 'Your changes',      Component: CorrectionLoopScreen },
  { name: 'Evidence',          Component: EvidenceScreen },
  { name: 'Safety net',        Component: SafetyScreen },
  { name: 'Ship moment',       Component: ShipScreen },
  { name: '24h report',        Component: ReportScreen },
];

/* ─────────────────────────────── APP SHELL ──────────────────────────────  */
const App = () => {
  const [screen, setScreen] = useState(0);
  const [animKey, setAnimKey] = useState(0);
  const total = SCREENS.length;

  const go = useCallback((n) => {
    if (n < 0 || n >= total) return;
    setScreen(n);
    setAnimKey(k => k + 1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, [total]);

  const pct = ((screen + 1) / total) * 100;
  const { Component } = SCREENS[screen];

  /* Keyboard navigation */
  useEffect(() => {
    const handler = (e) => {
      if (e.key === 'ArrowRight') go(screen + 1);
      if (e.key === 'ArrowLeft')  go(screen - 1);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [screen, go]);

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: T.bg, maxWidth: 480, margin: '0 auto', position: 'relative' }}>
      {/* Skip link for keyboard/screen reader users */}
      <a
        href="#main-content"
        style={{
          position: 'absolute', top: 8, left: 8, zIndex: 100,
          padding: '8px 12px', borderRadius: 6, fontSize: 13,
          background: T.primary, color: T.t1, fontFamily: font.inter,
          textDecoration: 'none', fontWeight: 500,
          transform: 'translateY(-60px)', transition: 'transform 0.1s',
        }}
        onFocus={e => { e.target.style.transform = 'translateY(0)'; }}
        onBlur={e => { e.target.style.transform = 'translateY(-60px)'; }}
      >
        Skip to content
      </a>
      {/* Progress bar — top of screen */}
      <div style={{ position: 'fixed', top: 0, left: 0, right: 0, height: 3, background: T.s2, zIndex: 50 }}>
        <div style={{
          height: '100%', background: T.primary,
          width: `${pct}%`, transition: 'width 0.4s cubic-bezier(0.4, 0, 0.2, 1)',
        }} />
      </div>

      {/* Top bar */}
      <header style={{
        position: 'fixed', top: 3, left: 0, right: 0, zIndex: 40,
        height: 56, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 20px',
        background: T.bg + 'f0',
        backdropFilter: 'blur(12px)',
        borderBottom: `1px solid ${T.border}`,
        maxWidth: 480, margin: '0 auto',
      }}>
        <span style={{ fontSize: 15, fontWeight: 700, fontFamily: font.grotesk, color: T.t1, letterSpacing: '-0.02em' }}>
          Artisan
        </span>
        <span style={{
          fontSize: 13, fontWeight: 500, color: T.t2,
          position: 'absolute', left: 0, right: 0, textAlign: 'center',
          pointerEvents: 'none', whiteSpace: 'nowrap',
        }}>
          {SCREENS[screen].name}
        </span>
        <span style={{ fontSize: 12, color: T.t3, fontFamily: 'monospace' }}>
          {screen + 1} / {total}
        </span>
      </header>

      {/* Scrollable content */}
      <main id="main-content" role="main" style={{
        flex: 1,
        marginTop: 59,
        marginBottom: 72,
        overflowY: 'auto',
        padding: '24px 20px 8px',
      }}>
        <div key={animKey} className="screen-enter">
          <Component />
        </div>
      </main>

      {/* Bottom nav */}
      <footer role="navigation" aria-label="Screen navigation" style={{
        position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 40,
        height: 68,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
        background: T.bg + 'f0',
        backdropFilter: 'blur(12px)',
        borderTop: `1px solid ${T.border}`,
        maxWidth: 480, margin: '0 auto',
        gap: 12,
      }}>
        <Btn
          variant="ghost"
          onClick={() => go(screen - 1)}
          disabled={screen === 0}
          style={{ minWidth: 80 }}
        >
          ← Back
        </Btn>

        {/* Dot nav — Fitts's Law: 44px hit area wrapping the visual 6px dot */}
        <div style={{ display: 'flex', gap: 2, alignItems: 'center', flex: 1, justifyContent: 'center' }}>
          {Array.from({ length: total }).map((_, i) => (
            <button
              key={i}
              onClick={() => go(i)}
              aria-label={`${SCREENS[i].name} (${i + 1} of ${total})`}
              style={{
                width: 24, height: 44, // full 44px tap target; visual indicator below
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                background: 'transparent', border: 'none', cursor: 'pointer', padding: 0,
              }}
            >
              <span style={{
                display: 'block',
                width: i === screen ? 20 : 6, height: 6,
                borderRadius: 3,
                background: i === screen ? T.primary : i < screen ? T.primary + '55' : T.s3,
                transition: 'width 0.2s ease, background 0.2s ease',
              }} />
            </button>
          ))}
        </div>

        <Btn
          onClick={() => go(screen + 1)}
          disabled={screen === total - 1}
          style={{ minWidth: 80 }}
        >
          Next →
        </Btn>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
